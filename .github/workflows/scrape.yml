name: Scrape Meeting Minutes

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC = midnight MT
  workflow_dispatch:       # allow manual trigger from GitHub UI
    inputs:
      resummarize:
        description: 'Re-summarize the N most recent meetings instead of scraping (blank = normal run)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: -r requirements.txt

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONESUITE_URL: ${{ secrets.ONESUITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: |
          if [ -n "$RESUMMARIZE" ]; then
            python scraper.py --resummarize "$RESUMMARIZE"
          else
            python scraper.py --recent
          fi

      - name: Commit and push if DB changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meeting_summaries.db
          if git diff --staged --quiet; then
            echo "No new meetings found, skipping commit."
          else
            git commit -m "Update meeting summaries [skip ci]"
            git push
          fi
